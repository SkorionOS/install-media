name: Installer ISO build
on:
  push:
    branches:
    - 'sk'
    - 'dialog'
jobs:
  build:
    name: Build ISO (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [lite, full]
        include:
          - variant: lite
            download_steam: false
            iso_suffix: "-lite"
            sha256_name: "sha256sum-lite.txt"
          - variant: full
            download_steam: true
            iso_suffix: ""
            sha256_name: "sha256sum.txt"
    outputs:
      version: ${{ steps.build_iso.outputs.version }}
      id: ${{ steps.build_iso.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Update submodules
        run: git submodule update --init --recursive
      - name: Download Steam
        if: matrix.download_steam
        run: |
          # URL="https://steamdeck-packages.steamos.cloud/archlinux-mirror/jupiter-main/os/x86_64/steam-jupiter-stable-1.0.0.81-2.5-x86_64.pkg.tar.zst"
          # mkdir -p chimeraos/airootfs/root/packages
          # curl -L -o chimeraos/airootfs/root/packages/steam-jupiter-stable.pkg.tar.zst $URL
          TAG="1751405894.2"
          URL="https://github.com/honjow/steam-bootstraplinux/releases/download/${TAG}/steam-bootstraplinux-${TAG}.tar.xz"
          mkdir -p chimeraos/airootfs/root/packages
          curl -L -o chimeraos/airootfs/root/packages/bootstraplinux_ubuntu12_32.tar.xz $URL

      - name: Build ISO
        id: build_iso
        env:
          VARIANT_SUFFIX: ${{ matrix.iso_suffix }}
        run: ./build-iso-docker.sh
      - name: Rename checksum file
        run: |
          mv output/sha256sum.txt output/${{ matrix.sha256_name }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.variant }}
          path: |
            output/*.iso
            output/${{ matrix.sha256_name }}

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.build.outputs.version }}_${{ needs.build.outputs.id }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.version }} (${{ needs.build.outputs.id }})
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: artifacts/*
