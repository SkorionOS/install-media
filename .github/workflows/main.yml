name: Installer ISO build
on:
  push:
    branches:
    - 'sk'
    - 'dialog'
    - 'skorionos'
    - 'gui'
jobs:
  build:
    name: Build ISO (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [online, standard]
        include:
          - variant: online
            download_steam: false
            download_steam_custom: false
            iso_suffix: "-online"
            sha256_name: "sha256sum-online.txt"
          - variant: standard
            download_steam: true
            download_steam_custom: false
            iso_suffix: ""
            sha256_name: "sha256sum.txt"
          # - variant: full
          #   download_steam: false
          #   download_steam_custom: true
          #   iso_suffix: "-full"
          #   sha256_name: "sha256sum-full.txt"
    outputs:
      version: ${{ steps.build_iso.outputs.version }}
      id: ${{ steps.build_iso.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Download UEFI Controller Drivers
        run: |
          echo "📥 Downloading UEFI drivers from honjow/UsbXbox360Dxe..."
          
          # Get latest release info with GitHub token
          LATEST_RELEASE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/honjow/UsbXbox360Dxe/releases/latest)
          
          # Extract all .efi file URLs
          EFI_URLS=$(echo "$LATEST_RELEASE" | grep -o 'https://[^"]*\.efi')
          
          if [ -z "$EFI_URLS" ]; then
            echo "⚠️  No .efi files found in latest release, skipping..."
            exit 0
          fi
          
          # Create target directory
          TARGET_DIR="skorionos/efiboot/EFI/systemd/drivers"
          mkdir -p "$TARGET_DIR"
          
          # Download each .efi file
          COUNT=0
          while IFS= read -r url; do
            if [ -n "$url" ]; then
              # Extract filename from URL
              FILENAME=$(basename "$url")
              echo "Downloading: $FILENAME"
              
              if curl -L -o "$TARGET_DIR/$FILENAME" "$url"; then
                FILE_SIZE=$(stat -c%s "$TARGET_DIR/$FILENAME")
                echo "  ✅ $FILENAME ($FILE_SIZE bytes)"
                COUNT=$((COUNT + 1))
              else
                echo "  ❌ Failed to download $FILENAME"
              fi
            fi
          done <<< "$EFI_URLS"
          
          if [ $COUNT -gt 0 ]; then
            echo ""
            echo "✅ Downloaded $COUNT UEFI driver(s) to $TARGET_DIR"
            ls -lh "$TARGET_DIR"
          else
            echo "❌ No drivers were downloaded"
            exit 1
          fi

      - name: Download Steam Custom
        if: matrix.download_steam_custom
        run: |
          TAG="1759461205"
          URL="https://github.com/honjow/steam-bootstraplinux/releases/download/${TAG}/steam-bootstraplinux-${TAG}.tar.xz"
          BOOTSTRAP_PATH="usr/lib/steam/bootstraplinux_ubuntu12_32.tar.xz"
          BOOTSTRAP_PKG_DIR="skorionos/airootfs/root/packages"
          BOOTSTRAP_PKG="bootstraplinux_ubuntu12_32.tar.xz"

          mkdir -p $BOOTSTRAP_PKG_DIR
          curl -L -o $BOOTSTRAP_PKG_DIR/$BOOTSTRAP_PKG $URL

          # 检查 .tar.xz 文件格式是否正确
          if ! xz -t $BOOTSTRAP_PKG_DIR/$BOOTSTRAP_PKG; then
            echo "Steam 引导文件格式不正确"
            exit 1
          fi
      
      - name: Download Steam
        if: matrix.download_steam
        run: |
          URL="https://steamdeck-packages.steamos.cloud/archlinux-mirror/jupiter-main/os/x86_64/steam-jupiter-stable-1.0.0.81-2.6-x86_64.pkg.tar.zst"
          STM_PKG="steam-jupiter-stable.pkg.tar.zst"
          BOOTSTRAP_PKG="bootstraplinux_ubuntu12_32.tar.xz"
          BOOTSTRAP_PATH="usr/lib/steam/bootstraplinux_ubuntu12_32.tar.xz"
          BOOTSTRAP_PKG_DIR="skorionos/airootfs/root/packages"

          curl -L -o $STM_PKG $URL
          mkdir -p $BOOTSTRAP_PKG_DIR
          tar -I zstd -xvf $STM_PKG $BOOTSTRAP_PATH -O > $BOOTSTRAP_PKG_DIR/$BOOTSTRAP_PKG
          # 检查 .tar.xz 文件格式是否正确
          if ! xz -t $BOOTSTRAP_PKG_DIR/$BOOTSTRAP_PKG; then
            echo "Steam 引导文件格式不正确"
            exit 1
          fi

      - name: Build ISO
        id: build_iso
        env:
          VARIANT_SUFFIX: ${{ matrix.iso_suffix }}
        run: ./build-iso-docker.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.variant }}
          if-no-files-found: error
          compression-level: 0
          path: |
            output/*.iso
            output/sha256sum*.txt
            output/build_info*.txt

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.build.outputs.version }}_${{ needs.build.outputs.id }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.version }} (${{ needs.build.outputs.id }})
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: artifacts/*
