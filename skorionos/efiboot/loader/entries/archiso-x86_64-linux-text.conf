title   Install SkorionOS (Text Mode)
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-skchos
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux-skchos.img
options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G installer=text ibt=off pci=noaer split_lock_detect=off iomem=relaxed preempt=full nowatchdog

