# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/device_profile_v1.json
# Schema version number
version: 1

kind: DeviceProfile
name: Simple keyboard profile
description: Minimal keyboard profile for OS installer

mapping:
  # Dpad
  - name: D-Up
    source_event:
      gamepad:
        button: DPadUp
    target_events:
      - keyboard: KeyUp
  - name: D-Down
    source_event:
      gamepad:
        button: DPadDown
    target_events:
      - keyboard: KeyDown
  - name: D-Left
    source_event:
      gamepad:
        button: DPadLeft
    target_events:
      - keyboard: KeyLeft
  - name: D-Right
    source_event:
      gamepad:
        button: DPadRight
    target_events:
      - keyboard: KeyRight

  # Left analog stick
  - name: Left Stick Up
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: up
          deadzone: 0.8
    target_events:
      - keyboard: KeyUp
  - name: Left Stick Down
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: down
          deadzone: 0.8
    target_events:
      - keyboard: KeyDown
  - name: Left Stick Left
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: left
          deadzone: 0.8
    target_events:
      - keyboard: KeyLeft
  - name: Left Stick Right
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: right
          deadzone: 0.8
    target_events:
      - keyboard: KeyRight

  # Right analog stick (Mouse movement)
  - name: Right Stick Mouse
    source_event:
      gamepad:
        axis:
          name: RightStick
    target_events:
      - mouse:
          motion:
            speed_pps: 800

  # Face Buttons
  - name: A Button
    source_event:
      gamepad:
        button: South
    target_events:
      - keyboard: KeyEnter
  - name: B Button
    source_event:
      gamepad:
        button: East
    target_events:
      - keyboard: KeyEsc
  - name: X Button
    source_event:
      gamepad:
        button: West
    target_events:
      - keyboard: KeyBackspace
  - name: Y Button
    source_event:
      gamepad:
        button: North
    target_events:
      - keyboard: KeySpace

  # Shoulder Buttons (Mouse clicks)
  - name: RB Button
    source_event:
      gamepad:
        button: RightBumper
    target_events:
      - mouse:
          button: Left
  - name: LB Button
    source_event:
      gamepad:
        button: LeftBumper
    target_events:
      - mouse:
          button: Right

  # Triggers
  - name: RT Trigger
    source_event:
      gamepad:
        trigger:
          name: RightTrigger
          deadzone: 0.2
    target_events:
      - keyboard: KeyPageDown
  - name: LT Trigger
    source_event:
      gamepad:
        trigger:
          name: LeftTrigger
          deadzone: 0.2
    target_events:
      - keyboard: KeyPageUp

  # Special Buttons
  - name: Start Button
    source_event:
      gamepad:
        button: Start
    target_events:
      - keyboard: KeyEnter
  - name: Select Button
    source_event:
      gamepad:
        button: Select
    target_events:
      - keyboard: KeyTab

  # Stick Clicks
  - name: Left Stick Click
    source_event:
      gamepad:
        button: LeftStick
    target_events:
      - keyboard: KeyHome
  - name: Right Stick Click
    source_event:
      gamepad:
        button: RightStick
    target_events:
      - keyboard: KeyEnd
